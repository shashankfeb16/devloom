# Local recording services. Use alongside compose.yaml.
services:
  recording-redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - recording_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    environment:
      REDIS_HOST: recording-redis:6379
    depends_on:
      recording-redis:
        condition: service_healthy

  recording-egress:
    image: livekit/egress:v1.15.0@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY:-devloom-local}"
        api_secret: "${LIVEKIT_API_SECRET:-devloom-local-only-secret-1234567890}"
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: recording-redis:6379
    depends_on:
      livekit:
        condition: service_started

  web:
    environment:
      RECORDINGS_S3_BUCKET: ${RECORDINGS_S3_BUCKET:?Set the private recordings bucket}
      RECORDINGS_S3_REGION: ${RECORDINGS_S3_REGION:?Set the recordings bucket region}
      RECORDINGS_S3_ACCESS_KEY_ID: ${RECORDINGS_S3_ACCESS_KEY_ID:?Set the recordings storage access key}
      RECORDINGS_S3_SECRET_ACCESS_KEY: ${RECORDINGS_S3_SECRET_ACCESS_KEY:?Set the recordings storage secret key}
      RECORDINGS_S3_ENDPOINT: ${RECORDINGS_S3_ENDPOINT:-}

volumes:
  recording_redis:
