# Run with compose.yaml and compose.recordings.yaml for loopback-only storage.
x-storage-image: &storage-image rustfs/rustfs:1.0.0-alpha.83@sha256:1cfa82fb394a7c6a4ffc24f5333b52afee608d258503f94b37fcce5cc965c896

services:
  recording-storage:
    image: *storage-image
    environment:
      RUSTFS_ADDRESS: ":19000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RECORDINGS_S3_ACCESS_KEY_ID:?Set the local recordings access key}
      RUSTFS_SECRET_KEY: ${RECORDINGS_S3_SECRET_ACCESS_KEY:?Set the local recordings secret key}
    volumes:
      - recording_objects:/data
    ports:
      - "127.0.0.1:19000:19000"
    networks:
      default:
        aliases: [recording-storage.localhost]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://localhost:19000/health"]
      interval: 3s
      timeout: 4s
      retries: 20

  recording-bucket:
    image: *storage-image
    entrypoint: ["/bin/sh", "-eu", "-c"]
    environment:
      RECORDINGS_S3_BUCKET: ${RECORDINGS_S3_BUCKET:?Set the local recordings bucket name}
      RECORDINGS_S3_REGION: ${RECORDINGS_S3_REGION:?Set the local recordings bucket region}
      RECORDINGS_S3_ACCESS_KEY_ID: ${RECORDINGS_S3_ACCESS_KEY_ID:?Set the local recordings access key}
      RECORDINGS_S3_SECRET_ACCESS_KEY: ${RECORDINGS_S3_SECRET_ACCESS_KEY:?Set the local recordings secret key}
    command:
      - |
        bucket_url="http://recording-storage:19000/$$RECORDINGS_S3_BUCKET"
        signed_request() {
          curl --silent --show-error --max-time 10 \
            --aws-sigv4 "aws:amz:$$RECORDINGS_S3_REGION:s3" \
            --user "$$RECORDINGS_S3_ACCESS_KEY_ID:$$RECORDINGS_S3_SECRET_ACCESS_KEY" "$$@"
        }
        status="$$(signed_request --head --output /dev/null --write-out '%{http_code}' "$$bucket_url")"
        case "$$status" in
          200) ;;
          404) signed_request --fail --request PUT "$$bucket_url" ;;
          *) echo "Recording bucket check failed (HTTP $$status)." >&2; exit 1 ;;
        esac
    depends_on:
      recording-storage:
        condition: service_healthy

  web:
    depends_on:
      recording-bucket:
        condition: service_completed_successfully

volumes:
  recording_objects:
